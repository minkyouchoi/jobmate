{% extends 'base.html' %}
{% block title %}이력서 삭제{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto mt-10 p-6 bg-white rounded-xl shadow">
  <h2 class="text-xl font-bold mb-4">이력서를 삭제할까요?</h2>
  <p class="mb-6 text-gray-600">{{ resume.name }}님의 이력서를 삭제합니다.</p>

  <form method="post">
    {% csrf_token %}
    <div class="flex gap-4">
      <button type="submit" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">삭제</button>
      <a href="{% url 'resumes:resume_detail' resume.pk %}" class="text-blue-500 hover:underline">취소</a>
    </div>
  </form>
</div>
{% endblock %}
