{% extends 'base.html' %}

{% block title %}로그인{% endblock %}

{% block content %}
<section class="max-w-md mx-auto py-12">
  <h2 class="text-2xl font-bold mb-6">로그인</h2>
  <form method="post" class="space-y-4 bg-white p-6 rounded-lg shadow">
    {% csrf_token %}
    <div>
      <label for="id_username" class="block font-semibold mb-1">아이디</label>
      <input type="text" name="username" required id="id_username" class="w-full px-4 py-2 border rounded">
    </div>
    <div>
      <label for="id_password" class="block font-semibold mb-1">비밀번호</label>
      <input type="password" name="password" required id="id_password" class="w-full px-4 py-2 border rounded">
    </div>
    <button type="submit" class="bg-blue-500 text-white font-bold px-6 py-2 rounded hover:bg-blue-600 transition">
      로그인
    </button>
    {% if form.errors %}
  <div class="bg-red-100 text-red-700 p-3 rounded mb-4">
    아이디 또는 비밀번호가 틀렸습니다.
  </div>
{% endif %}
  </form>
</section>
{% endblock %}
