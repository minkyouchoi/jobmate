{% extends 'base.html' %}
{% load static %}

{% block title %}Jobmate - Landing{% endblock %}


{% block content %}
  <!-- ✅ Hero Section -->
  <section class="text-center py-12 relative overflow-hidden">
    <h2 class="text-4xl font-black mb-2">FIND TALENT, GET HIRED.</h2>
    <h3 class="text-3xl font-bold mb-6">WITH JOBMATE</h3>

    <!-- ✅ 손 애니메이션 (Lottie) -->
    <div class="h-36 overflow-hidden flex justify-center items-start">
      <div id="lottie-hand" class="h-64 w-64 -mt-10"></div>
    </div>

    <!-- 실제 버튼 아래 클릭 영역 -->
    <div class="mt-4">
        <a href="#" class="bg-yellow-300 text-black font-bold px-6 py-4 rounded-xl shadow-lg hover:bg-yellow-400 transition">
        SIGN UP NOW
      </a>
    </div>
  </section>

  <!-- ✅ 구름 애니메이션
  <section class="mt-16 text-center">
    <img src="{% static 'img/cloud.gif' %}" alt="Cloud Animation" class="mx-auto w-32">
    <p class="mt-2 text-sm">Your friends are waiting!</p>
  </section> -->

  <!-- ✅ Lottie 로딩 스크립트는 body 제일 아래 -->
  <script src="https://unpkg.com/lottie-web/build/player/lottie.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lottie.loadAnimation({
        container: document.getElementById('lottie-hand'),
        renderer: 'svg',
        loop: true,
        autoplay: true,
        path: "{% static 'animations/Animation - 1746003255741.json' %}"
      });
    });
  </script>

{% endblock %}
