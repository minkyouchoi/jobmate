{% extends 'base.html' %}
{% block title %}채용공고 목록{% endblock %}

{% block content %}
  <h2 class="text-3xl font-bold mb-6">📋 채용공고 목록</h2>

  <div class="grid grid-cols-1 gap-4">
    {% for job in jobs %}
      <div class="p-4 bg-white rounded shadow hover:bg-yellow-50 transition">
        <h3 class="text-xl font-bold">{{ job.title }}</h3>
        <p class="text-sm text-gray-600">기업: {{ job.company.name }}</p>
        <p class="text-sm text-gray-500">등록일: {{ job.created_at|date:"Y-m-d" }}</p>
        <a href="{% url 'jobs:job_detail' job.pk %}" class="text-blue-500 hover:underline">자세히 보기</a>
      </div>
    {% empty %}
      <p>등록된 채용공고가 없습니다.</p>
    {% endfor %}
  </div>
{% endblock %}
