{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto mt-20 text-center">
  <h2 class="text-2xl font-bold mb-4">정말 삭제하시겠습니까?</h2>
  <p class="mb-8">[{{ job.title }}] 공고가 영구 삭제됩니다.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="bg-red-500 text-white px-6 py-2 rounded hover:bg-red-600 mr-4">삭제</button>
    <a href="{% url 'jobs:job_detail' job.pk %}" class="text-blue-500 hover:underline">취소</a>
  </form>
</div>
{% endblock %}
