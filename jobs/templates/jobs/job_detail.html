{% extends "base.html" %}

{% block content %}
<div class="max-w-4xl mx-auto mt-10 px-4">
  <h1 class="text-3xl font-bold mb-4">{{ job.title }}</h1>
  <p class="text-lg text-gray-700 mb-2"><strong>회사명:</strong> {{ job.company }}</p>
  <p class="text-sm text-gray-500 mb-6"><strong>등록일:</strong> {{ job.created_at }}</p>
  <div class="text-gray-800 leading-relaxed">
    {{ job.description|linebreaks }}
  </div>
  <a href="{% url 'jobs:job_list' %}" class="inline-block mt-6 text-blue-500 hover:underline">← 목록으로 돌아가기</a>

</div>
{% endblock %}
